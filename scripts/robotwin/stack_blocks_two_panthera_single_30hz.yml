# Panthera single-arm collection of stack_blocks_two at 30 fps, robot centered at x=0.
# Same settings as move_pillbottle_pad_panthera_single_30hz.yml (save_freq 8 = 31.25 Hz,
# domain randomisation on, one instruction per episode) without that task's panthera_* keys.
# Keep episode_num at 200: RoboTwin hashes this file into the collection fingerprint, so
# editing it later stops collection from resuming in the same output folder.
arm_mode: single
render_freq: 0
episode_num: 200
use_seed: false
save_freq: 8
embodiment: [panthera-6dof]
language_num: 1
domain_randomization:
  random_background: true
  cluttered_table: true
  clean_background_rate: 0.6
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: true
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D405
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 1
collect_data: true
eval_video_log: true
